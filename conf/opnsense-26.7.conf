

# OPNsense 26.7, amd64. This is a firewall appliance, not a general-purpose
# BSD, and it is the only builder here that can use neither cloud-init nor
# libguestfs to prepare its image -- so everything is done over the serial
# console. See hooks/host_enablessh.py for the whole story.
#
# The "nano" image is used rather than the dvd/vga/serial installers: nano is
# PREINSTALLED and already boots on ttyu0, so there is no installer to
# automate at all. It is a bzip2-compressed raw image, which base-builder's
# _prep_vhd_disk learned to handle for this builder.
VM_VHD_LINK="https://pkg.opnsense.org/releases/26.7/OPNsense-26.7-nano-amd64.img.bz2"
VM_OS_NAME="opnsense"
VM_SSH_PORT=2222
VM_RELEASE=26.7

# The appliance's built-in credentials. Unlike every other builder here we
# cannot set our own: there is no offline write path into a UFS root, so the
# first console login has to use what upstream shipped.
VM_ROOT_PASSWORD=opnsense

VM_LOGIN_TAG="(ttyu0)"

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="pkg install -y "

# rsync IS in OPNsense's own repository (rsync-3.4.4, probed live). sshfs is
# NOT -- `pkg search fusefs-sshfs` returns nothing -- so sshfs sync is
# unavailable and VM_SSHFS_PKG stays empty. scp comes from base; nfs and tar
# need nothing installed in the guest.
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG=

VM_PRE_INSTALL_PKGS="$VM_RSYNC_PKG"

VM_NIC=virtio

# Everything is driven over the serial chardev; the appliance has no usable
# graphical console and OCR would be pointless here.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,nfs,tar"
